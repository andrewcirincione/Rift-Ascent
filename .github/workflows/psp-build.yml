name: Build Rift Ascent PSP Hardware Diagnostic EBOOT

on:
  push:
    paths:
      - 'Rift_Ascent_GitHub_OneClick_Setup.zip'
      - '.github/workflows/psp-build.yml'
      - 'patches/diagnose_psp_boot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-psp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract and inspect actual uploaded game
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Rift_Ascent_GitHub_OneClick_Setup.zip | tail -1
          unzip -q -o Rift_Ascent_GitHub_OneClick_Setup.zip
          test -f GAME/Makefile
          test -f GAME/verify_eboot.py
          test -f GAME/src/psp_main.c
          echo "Extracted GAME sources and PSP build files."
          ls -lah GAME/src

      - name: Insert hardware boot diagnostics
        run: |
          set -euo pipefail
          python3 patches/diagnose_psp_boot.py GAME/src/psp_main.c
          grep -q 'RIFT_BOOT_PATH' GAME/src/psp_main.c

      - name: Run native PSPDEV compiler and linker
        shell: bash
        run: |
          set -euo pipefail
          docker pull pspdev/pspdev:v20261001
          docker run --rm -v "$PWD/GAME:/src" -w /src pspdev/pspdev:v20261001 sh -c '
            set -eu
            psp-gcc --version
            psp-config --pspsdk-path
            make clean
            rm -f EBOOT.PBP
            make -j2
            test -s EBOOT.PBP
          '

      - name: Validate compiled PSP EBOOT structure
        shell: bash
        run: |
          set -euo pipefail
          python3 GAME/verify_eboot.py GAME/EBOOT.PBP
          sha256sum GAME/EBOOT.PBP | tee EBOOT_SHA256.txt

      - name: Publish EBOOT and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Ascent-Hardware-Diagnostic-EBOOT
          path: |
            GAME/EBOOT.PBP
            EBOOT_SHA256.txt
          if-no-files-found: error
