name: 1.8 prerelease startup correction
on:
  push:
    branches: [1.8-Pre-release]
    paths: ['.github/workflows/1.8-startup-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: 1.8-startup-correction
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RIFT_ROOT: prerelease/1.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.8-Pre-release
          fetch-depth: 1
          sparse-checkout: |
            prerelease/1.8
            tools
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate branch and preserve published binary
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = '1.8-Pre-release'
          git ls-remote --heads --tags origin | grep -vE '/1\.8-Pre-release$|/v1\.8-pre\.2(\^\{\})?$' > "$RUNNER_TEMP/refs.before"
          cp "$RIFT_ROOT/release/EBOOT.PBP" "$RUNNER_TEMP/pre1.PBP"
          mkdir -p "$RIFT_ROOT/evidence/bootfix"
          patch --batch --fuzz=0 -p1 -d "$RIFT_ROOT/source" < "$RIFT_ROOT/bootfix/startup.patch"
          python -m pip install pillow==11.3.0 websockets==15.0.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth libgl1-mesa-dri libglu1-mesa libasound2t64 libpulse0
      - name: Sanitized native launch and progression regressions
        run: |
          set -euo pipefail
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -I "$RIFT_ROOT/source" "$RIFT_ROOT/bootfix/test_launch_path.c" "$RIFT_ROOT/source/launch_path.c" -o "$RUNNER_TEMP/launch-test"
          "$RUNNER_TEMP/launch-test" | tee "$RIFT_ROOT/evidence/bootfix/native-paths.txt"
          gcc -std=gnu11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I "$RIFT_ROOT/source" "$RIFT_ROOT/tests/progression.c" "$RIFT_ROOT/source/game.c" -o "$RUNNER_TEMP/progression"
          "$RUNNER_TEMP/progression" | tee "$RIFT_ROOT/evidence/bootfix/native-progression.txt"
      - name: Fresh PSPDEV build and byte-preserved artwork/music package
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/$RIFT_ROOT/source:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; psp-nm -S rift_ascent_crt_free.elf > symbols.txt' 2>&1 | tee "$RIFT_ROOT/evidence/bootfix/build.log"
          sudo chown -R "$(id -u):$(id -g)" "$RIFT_ROOT/source"
          cp "$RIFT_ROOT/source/rift_ascent_crt_free.elf" "$RIFT_ROOT/release/"
          python "$RIFT_ROOT/bootfix/package.py" package "$RUNNER_TEMP/pre1.PBP" | tee "$RIFT_ROOT/evidence/bootfix/package.txt"
      - name: Prepare pinned PPSSPP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ppsspp"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12795586984/zip" > "$RUNNER_TEMP/ppsspp.zip"
          unzip -q "$RUNNER_TEMP/ppsspp.zip" -d "$RUNNER_TEMP/ppsspp"
          image=$(find "$RUNNER_TEMP/ppsspp" -name PPSSPP.AppImage -print -quit)
          chmod +x "$image"
          cd "$RUNNER_TEMP/ppsspp"
          "$image" --appimage-extract >/dev/null
          app=$(find "$RUNNER_TEMP/ppsspp" -path '*/AppDir/AppRun' -print -quit)
          test -n "$app"
          if [ -f "$(dirname "$app")/.env" ]; then sed -i 's/SDL_AUDIODRIVER=pulseaudio/SDL_AUDIODRIVER=dummy/' "$(dirname "$app")/.env"; fi
          echo "PPSSPP_APP=$app" >> "$GITHUB_ENV"
      - name: Reproduce old failure and test corrected exact EBOOT
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 960x544x24' python "$RIFT_ROOT/bootfix/smoke.py" "$RIFT_ROOT" "$PPSSPP_APP" "$RUNNER_TEMP/pre1.PBP" 2>&1 | tee "$RIFT_ROOT/evidence/bootfix/emulator.txt"
          python "$RIFT_ROOT/bootfix/package.py" finalize
      - name: Push corrected readable source and tested complete EBOOT to prerelease only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = '1.8-Pre-release'
          cp "$RIFT_ROOT/source/symbols.txt" "$RIFT_ROOT/evidence/bootfix/symbols.txt"
          rm -f "$RIFT_ROOT/source/"*.o "$RIFT_ROOT/source/"*.elf "$RIFT_ROOT/source/EBOOT.PBP" "$RIFT_ROOT/source/PARAM.SFO" "$RIFT_ROOT/source/game.map" "$RIFT_ROOT/source/symbols.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$RIFT_ROOT/source" "$RIFT_ROOT/release" "$RIFT_ROOT/evidence/bootfix" "$RIFT_ROOT/bootfix/RELEASE_NOTES.md"
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith('prerelease/1.8/') for p in paths)
          PY
          git commit -m 'Fix 1.8 startup using kernel launch path; preserve media and verify renamed-folder boot'
          git push origin HEAD:refs/heads/1.8-Pre-release
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish new pre.2 without overwriting previous releases
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,json,os
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];tag='v1.8-pre.2'
          def api(endpoint,*args):return json.loads(subprocess.check_output(['gh','api',endpoint,*args],text=True))
          releases=api(f'repos/{repo}/releases?per_page=100')
          assert not any(r['tag_name']==tag for r in releases),'Refusing to overwrite an existing pre.2 release'
          payload=dict(tag_name=tag,target_commitish=os.environ['RELEASE_COMMIT'],name='Rift Ascent 1.8 Pre-release 2 — startup fix',body=Path('prerelease/1.8/bootfix/RELEASE_NOTES.md').read_text(),draft=True,prerelease=True,make_latest='false')
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases','--method','POST','--input','-'],input=json.dumps(payload),text=True))
          Path(os.environ['RUNNER_TEMP']+'/release-id').write_text(str(r['id']))
          PY
          gh release upload v1.8-pre.2 "$RIFT_ROOT/bootfix/dist/"*
          release_id=$(cat "$RUNNER_TEMP/release-id")
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/remote.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/remote.json').read_text());assert r['draft'] and r['prerelease']
          assets={a['name']:a for a in r['assets']}
          for p in Path('prerelease/1.8/bootfix/dist').iterdir():
           if p.is_file():
            a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print('PASS uploaded asset byte counts and SHA256 digests')
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH -F draft=false -F prerelease=true -f make_latest=false > "$RIFT_ROOT/evidence/bootfix/PUBLISHED.json"
          git ls-remote --heads --tags origin | grep -vE '/1\.8-Pre-release$|/v1\.8-pre\.2(\^\{\})?$' > "$RUNNER_TEMP/refs.after"
          cmp "$RUNNER_TEMP/refs.before" "$RUNNER_TEMP/refs.after"
          echo 'https://github.com/andrewcirincione/Rift-Ascent/releases/tag/v1.8-pre.2' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1.8-pre.2-startup-fix
          path: |
            prerelease/1.8/bootfix/dist/
            prerelease/1.8/evidence/bootfix/
          if-no-files-found: warn
          compression-level: 1
