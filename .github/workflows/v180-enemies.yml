name: 1.8 enemy illustration refresh
on:
  push:
    branches: [release-1.8-final]
    paths: ['.github/workflows/v180-enemies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: early
            ids: '0,1,11'
          - group: late
            ids: '18,21,31'
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa/v180
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.35.1 transformers==4.49.0 accelerate==1.10.1 safetensors==0.6.2 pillow==11.3.0
      - run: python qa/v180/generate_enemies.py '${{ matrix.ids }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v180-enemies-${{ matrix.group }}
          path: enemy-art/
          compression-level: 0
