name: Archive v1.1.0 Engine-Only EBOOT
on:
  push:
    paths:
      - '.github/workflows/archive-110-engine.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.ref_name == 'release-1.1.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive successfully compiled base EBOOT without private audio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p versions/1.1.0
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12533178863/zip" > /tmp/base110.zip
          unzip -p /tmp/base110.zip portable_build/EBOOT.PBP > versions/1.1.0/BASE_EBOOT.PBP
          test -s versions/1.1.0/BASE_EBOOT.PBP
          (cd versions/1.1.0 && sha256sum BASE_EBOOT.PBP > BASE_SHA256.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f versions/1.1.0/BASE_EBOOT.PBP
          git add versions/1.1.0/BASE_SHA256.txt
          git commit -m "Archive validated v1.1.0 PSP engine EBOOT (private soundtrack excluded)"
          git push origin HEAD:release-1.1.0
