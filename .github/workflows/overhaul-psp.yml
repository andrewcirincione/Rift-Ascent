name: Rift Ascent PSP Gameplay Overhaul

on:
  push:
    paths:
      - 'overhaul/**'
      - '.github/workflows/overhaul-psp.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  compile-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare full game modules with CRT-free entry
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o Rift_Ascent_GitHub_OneClick_Setup.zip
          python3 overhaul/patch_engine.py GAME/src
          python3 overhaul/v101/patch_game.py GAME/src
          python3 overhaul/patch_render.py GAME/src
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pil fonts-dejavu-core
          python3 overhaul/make_font.py GAME/src/font_smooth.h
          python3 overhaul/patch_font.py GAME/src
          python3 overhaul/patch_polish.py GAME/src
          python3 overhaul/patch_telegraphs.py GAME/src
          python3 overhaul/v101/patch_ui.py GAME/src
          python3 overhaul/v101/patch_visuals.py GAME/src/render.c
          python3 overhaul/v102/01_pause_game.py GAME/src
          python3 overhaul/v102/02_cards_clear_hud.py GAME/src/render.c
          python3 overhaul/v102/03_intent_weapon.py GAME/src/render.c
          python3 overhaul/v102/04_sunder_preview.py GAME/src/render.c
          python3 overhaul/v102/05_grid_controls.py GAME/src/game.c
          python3 overhaul/v102/06_shop_details.py GAME/src/render.c
          python3 overhaul/v102/07_footer_icons.py GAME/src/render.c
          python3 overhaul/v102/08_event_reward_preview.py GAME/src
          python3 overhaul/v102/09_full_card_text.py GAME/src/render.c
          python3 overhaul/v102/10_status_chips.py GAME/src/render.c
          python3 overhaul/v102/11_hide_no_attack.py GAME/src/render.c
          python3 overhaul/v102/12_small_overflow_arrow.py GAME/src/render.c
          python3 overhaul/v102/13_enemy_block.py GAME/src/render.c
          python3 overhaul/v102/14_disable_unplayable.py GAME/src/render.c
          python3 overhaul/v102/15_empty_energy.py GAME/src/render.c
          python3 overhaul/v102/16_hand_animation.py GAME/src/render.c
          python3 overhaul/v102/17_relic_claim_preview.py GAME/src
          python3 overhaul/v102/18_map_hover.py GAME/src
          python3 overhaul/v102/19_combat_deck.py GAME/src
          python3 overhaul/v102/20_full_card_names.py GAME/src/render.c
          python3 overhaul/v102/22_screenshot_polish.py GAME/src/render.c
          python3 overhaul/v103/patch_game.py GAME/src
          python3 overhaul/v103/patch_cards.py GAME/src
          python3 overhaul/v103/patch_render.py GAME/src/render.c
          python3 overhaul/v103/patch_art.py GAME/src/render.c
          python3 overhaul/v103/patch_facing.py GAME/src/render.c
          python3 overhaul/v110/generate_art.py GAME/src
          python3 overhaul/v110/patch_inferno.py GAME/src
          python3 overhaul/v110/patch_render.py GAME/src/render.c
          python3 overhaul/v110/audit_cards_patch.py GAME/src
          python3 overhaul/v110/fix_remaining_mechanics.py GAME/src
          python3 overhaul/v110/expand_ironclad_roster.py GAME/src
          python3 overhaul/v110/finalize_five_cards.py GAME/src
          python3 overhaul/v110/patch_latest_wiki.py GAME/src
          python3 overhaul/v111/01_catalog.py GAME/src
          python3 overhaul/v111/02_power_hooks.py GAME/src
          python3 overhaul/v111/03_card_effects.py GAME/src
          python3 overhaul/v112/patch_art.py GAME/src
          python3 overhaul/v112/test_art.py GAME/src
          python3 overhaul/v113/patch_game_ui.py GAME/src
          python3 overhaul/v113/generate_art.py GAME/src
          python3 overhaul/v113/qa_fix.py GAME/src
          cp overhaul/v113/sfx_only.c GAME/src/sound.c
          # The only actual music in the distributed EBOOT is later packaged
          # privately from the ten user-provided WAV files, not stored in Git.
          cp overhaul/sound_v2.h GAME/src/sound.h
          mkdir -p portable_build
          cp GAME/src/* portable_build/
          cp portable/psp_start.c portable/mini_libc.c portable/boot_trace.c portable/boot_trace.h portable/file_syscalls.S portable/callback_syscalls.S portable_build/
          cp startup_probe/user_syscalls.S portable_build/
          python3 overhaul/patch_frontend.py portable_build/psp_start.c
          python3 overhaul/patch_windup.py portable_build/psp_start.c
          python3 overhaul/v101/patch_controls.py portable_build/psp_start.c
          python3 overhaul/v102/01_pause_psp.py portable_build/psp_start.c
          python3 overhaul/v103/patch_audio.py portable_build/psp_start.c
          python3 overhaul/v110/patch_audio_gain.py portable_build/psp_start.c
          python3 overhaul/v110/keep_choice_music.py portable_build/psp_start.c
          python3 overhaul/v113/patch_audio.py portable_build/psp_start.c
          cp GAME/assets/ICON0.PNG portable_build/ICON0.PNG
          cp GAME/assets/PIC1.PNG portable_build/PIC1.PNG
          cp GAME/src/rift112_pic1.png portable_build/PIC1.PNG
          cat > portable_build/Makefile <<'EOF'
          TARGET = rift_ascent_crt_free
          OBJS = psp_start.o boot_trace.o mini_libc.o user_syscalls.o file_syscalls.o callback_syscalls.o game.o render.o artwork.o motion_art.o enemy_art.o sound.o
          PSP_FW_VERSION = 660
          PSP_LARGE_MEMORY = 0
          CFLAGS = -DRIFT_BOOT_TRACE -O2 -G0 -Wall -Wextra -std=gnu11 -ffreestanding -fno-builtin -fno-strict-aliasing -fno-stack-protector
          LDFLAGS += -nostdlib -nostartfiles -Wl,-e,_start -Wl,-Map,game.map
          LIBS = -lpspdisplay -lpspge -lpspctrl -lpspaudio -lgcc
          EXTRA_TARGETS = EBOOT.PBP
          PSP_EBOOT_TITLE = RIFT ASCENT 1.1.3
          PSP_EBOOT_ICON = ICON0.PNG
          PSP_EBOOT_PIC1 = PIC1.PNG
          PSPSDK = $(shell psp-config --pspsdk-path)
          include $(PSPSDK)/lib/build.mak
          EOF

      - name: Export 1.0.1 engine sources for review
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Ascent-Engine-Sources
          path: |
            GAME/src/game.c
            GAME/src/game.h
            GAME/src/render.c

      - name: Audit music-source policy (strictly user's ten recordings)
        shell: bash
        run: |
          set -euo pipefail
          python3 overhaul/v113/test_audio_policy.py GAME/src/sound.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path("portable_build/psp_start.c").read_text()
          assert "rift_audio_generate(&music,audio_buffer,512,track,1);" in p
          assert "soundtrack_active?1:0" not in p
          assert "soundtrack_open();" in p
          print("PASS: PSP mixes embedded songs plus SFX, never synthesizes music")
          PY

      - name: Compile and run native deterministic gameplay tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -I GAME/src overhaul/test_engine.c GAME/src/game.c -o engine_tests
          ASAN_OPTIONS=detect_leaks=1 ./engine_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -I GAME/src overhaul/v101/test_101.c GAME/src/game.c -o v101_tests
          ASAN_OPTIONS=detect_leaks=1 ./v101_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
             -I GAME/src overhaul/v102/test_pause.c GAME/src/game.c -o pause_tests
          ASAN_OPTIONS=detect_leaks=1 ./pause_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
             -I GAME/src overhaul/v102/test_102.c GAME/src/game.c -o v102_tests
          ASAN_OPTIONS=detect_leaks=1 ./v102_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v103/test_103.c GAME/src/game.c -o v103_tests
          ASAN_OPTIONS=detect_leaks=1 ./v103_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_inferno.c GAME/src/game.c -o inferno_tests
          ASAN_OPTIONS=detect_leaks=1 ./inferno_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_card_audit.c GAME/src/game.c -o card_audit_tests
          ASAN_OPTIONS=detect_leaks=1 ./card_audit_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_choice_mechanics.c GAME/src/game.c -o choice_tests
          ASAN_OPTIONS=detect_leaks=1 ./choice_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_expanded_roster.c GAME/src/game.c -o expanded_roster_tests
          ASAN_OPTIONS=detect_leaks=1 ./expanded_roster_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_final_five.c GAME/src/game.c -o final_five_tests
          ASAN_OPTIONS=detect_leaks=1 ./final_five_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v110/test_latest_wiki.c GAME/src/game.c -o latest_wiki_tests
          ASAN_OPTIONS=detect_leaks=1 ./latest_wiki_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v111/test_full_87.c GAME/src/game.c -o full_87_tests
          ASAN_OPTIONS=detect_leaks=1 ./full_87_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v111/test_87_upgrades.c GAME/src/game.c -o all_upgrade_tests
          ASAN_OPTIONS=detect_leaks=1 ./all_upgrade_tests
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I GAME/src overhaul/v103/test_campaign.c GAME/src/game.c -o campaign_tests
          ASAN_OPTIONS=detect_leaks=1 ./campaign_tests
          python3 tools/embed_soundtrack_103.py --self-test
          python3 tools/embed_churn.py --self-test
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -I GAME/src \
            overhaul/v113/test_qa.c GAME/src/game.c GAME/src/sound.c -o qa_tests
          ASAN_OPTIONS=detect_leaks=1 ./qa_tests

      - name: PSPDEV compile/link full gameplay + illustrated v1.1.3 assets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/portable_build:/src" -w /src pspdev/pspdev:v20261001 sh -c '
            set -eu
            make clean
            make -j2
            test -s EBOOT.PBP
          '
          python3 tools/audit_psp_imports.py portable_build/EBOOT.PBP | tee portable_build/imports.txt
          python3 GAME/verify_eboot.py portable_build/EBOOT.PBP
          sha256sum portable_build/EBOOT.PBP | tee portable_build/SHA256.txt
          python3 overhaul/v103/test_audio_package.py portable_build/EBOOT.PBP portable_build/EMBED_TEST.PBP


      - name: Download Linux PPSSPP and dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb imagemagick libgl1-mesa-dri libglu1-mesa libasound2t64 libpulse0 pulseaudio pulseaudio-utils curl
          curl --fail --location --retry 3 --output PPSSPP.AppImage https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          chmod +x PPSSPP.AppImage
          ./PPSSPP.AppImage --appimage-extract >/dev/null

      - name: PPSSPP renders illustrated full-game main menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator_results
          export LIBGL_ALWAYS_SOFTWARE=1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/rift-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rift_null || true
          # The audio decoder reads its own EBOOT from ms0:, not the host path.
          # PPSSPP locations vary across Linux releases, so populate both.
          mkdir -p "$HOME/.config/ppsspp/PSP/GAME/RIFTASCENT"
          mkdir -p "$HOME/.config/ppsspp/GAME/RIFTASCENT"
          cp portable_build/EMBED_TEST.PBP "$HOME/.config/ppsspp/PSP/GAME/RIFTASCENT/EBOOT.PBP"
          cp portable_build/EMBED_TEST.PBP "$HOME/.config/ppsspp/GAME/RIFTASCENT/EBOOT.PBP"
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -u
            ./squashfs-root/AppRun "$PWD/portable_build/EMBED_TEST.PBP" > emulator_results/ppsspp.log 2>&1 &
            pid=$!
            sleep 12
            import -display "$DISPLAY" -window root emulator_results/game-title.png
            if ! kill -0 "$pid" 2>/dev/null;then
              echo "FAIL: PPSSPP exited unexpectedly";exit 1
            fi
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          '
          test -s emulator_results/game-title.png
          colors="$(identify -format '%k' emulator_results/game-title.png)"
          echo "Unique screen colors: $colors"
          test "$colors" -ge 64
          tail -60 emulator_results/ppsspp.log || true

      - name: Confirm PSP boot-trace file is actually written in PPSSPP
        shell: bash
        run: |
          set -euo pipefail
          find "$HOME" -name RIFT_BOOT.LOG -type f -print | tee emulator_results/trace-locations.txt
          candidate="$(find "$HOME" -name RIFT_BOOT.LOG -type f -print -quit)"
          if [ -z "$candidate" ]; then
            echo "BOOT TRACE WAS NOT WRITTEN IN PPSSPP" >&2
            exit 1
          fi
          cp "$candidate" emulator_results/boot-trace.log
          cat emulator_results/boot-trace.log
          grep -q 'PSP module start:' emulator_results/boot-trace.log
          grep -q 'render first finished:' emulator_results/boot-trace.log
          grep -q 'frame 1 rendered:' emulator_results/boot-trace.log
          grep -q 'initial frame committed at vblank: 0' emulator_results/boot-trace.log
          grep -q 'frame present vblank result: 0' emulator_results/boot-trace.log
          grep -q 'frame flip result: 0' emulator_results/boot-trace.log
          # Prove the audio worker can open and validate the embedded index.
          grep -q 'Rift 1.0.3 embedded music loaded: 10' emulator_results/boot-trace.log
          if grep -q 'FATAL' emulator_results/boot-trace.log; then
            echo "Startup/present failed according to PSP trace" >&2
            exit 1
          fi

      - name: Build deterministic internal-control gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          cp -a portable_build portable_demo
          sed -i 's/^CFLAGS = /CFLAGS = -DRIFT_SMOKE_DEMO /' portable_demo/Makefile
          python3 overhaul/v110/demo_inferno_card.py portable_demo/psp_start.c
          docker run --rm -v "$PWD/portable_demo:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; test -s EBOOT.PBP'
          python3 tools/audit_psp_imports.py portable_demo/EBOOT.PBP > portable_demo/imports.txt

      - name: PPSSPP verifies that game actions advance the visual state
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/rift-demo-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rift_demo_null || true
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -u
            ./squashfs-root/AppRun "$PWD/portable_demo/EBOOT.PBP" > emulator_results/ppsspp-demo.log 2>&1 &
            pid=$!
            sleep 13
            import -display "$DISPLAY" -window root emulator_results/game-actions.png
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "FAIL: PPSSPP exited during gameplay smoke test" >&2
              exit 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s emulator_results/game-actions.png
          colors="$(identify -format '%k' emulator_results/game-actions.png)"
          echo "Gameplay screenshot unique colors: $colors"
          test "$colors" -gt 64
          metric="$(compare -metric AE emulator_results/game-title.png emulator_results/game-actions.png null: 2>&1 || true)"
          echo "Title-to-gameplay pixel difference: $metric"
          if ! [[ "$metric" =~ ^[0-9]+$ ]]; then
            echo "Could not compare screenshots" >&2; exit 1
          fi
          test "$metric" -gt 20000
          tail -60 emulator_results/ppsspp-demo.log || true

      - name: Compile alternate route-map and glossary previews
        shell: bash
        run: |
          set -euo pipefail
          cp -a portable_build portable_map
          cp -a portable_build portable_inspect
          sed -i 's/^CFLAGS = /CFLAGS = -DRIFT_MAP_DEMO /' portable_map/Makefile
          sed -i 's/^CFLAGS = /CFLAGS = -DRIFT_SMOKE_DEMO -DRIFT_INSPECT_DEMO /' portable_inspect/Makefile
          python3 overhaul/patch_ci_demos.py portable_map/psp_start.c
          python3 overhaul/patch_ci_demos.py portable_inspect/psp_start.c
          for name in portable_map portable_inspect; do
            docker run --rm -v "$PWD/$name:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; test -s EBOOT.PBP'
            python3 tools/audit_psp_imports.py "$name/EBOOT.PBP" > "$name/imports.txt"
          done

      - name: Check screenshots of branching map and expanded enemy glossary
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/rift-panels-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rift_panels_null || true
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -eu
            for name in portable_map portable_inspect; do
              ./squashfs-root/AppRun "$PWD/$name/EBOOT.PBP" > "emulator_results/$name.log" 2>&1 &
              pid=$!
              sleep 13
              import -display "$DISPLAY" -window root "emulator_results/$name.png"
              if ! kill -0 "$pid" 2>/dev/null; then echo "PPSSPP died for $name" >&2; exit 1; fi
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
          '
          for name in portable_map portable_inspect; do
            test -s "emulator_results/$name.png"
            colors="$(identify -format '%k' "emulator_results/$name.png")"
            echo "$name colors: $colors"
            test "$colors" -gt 64
          done

      - name: Playtest independently booted event/shop/reward/boss/map scenes in PPSSPP
        shell: bash
        run: |
          set -euo pipefail
          for scene in event shop reward boss map; do
            echo "Preparing $scene screen"
            cp -a portable_build "portable_qa_$scene"
            macro="$(printf '%s' "$scene" | tr '[:lower:]' '[:upper:]')"
            sed -i "s/^CFLAGS = /CFLAGS = -DRIFT_QA_$macro /" "portable_qa_$scene/Makefile"
            python3 overhaul/v113/qa_scenes.py "portable_qa_$scene/psp_start.c"
            docker run --rm -v "$PWD/portable_qa_$scene:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; test -s EBOOT.PBP'
          done
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/rift-qa-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rift_qa_null || true
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -eu
            for scene in event shop reward boss map; do
              ./squashfs-root/AppRun "$PWD/portable_qa_$scene/EBOOT.PBP" > "emulator_results/qa-$scene.log" 2>&1 &
              pid=$!
              sleep 9
              import -display "$DISPLAY" -window root "emulator_results/qa-$scene.png"
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
              test -s "emulator_results/qa-$scene.png"
            done
          '
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          names=['event','shop','reward','boss','map']
          ims=[Image.open(Path('emulator_results')/f'qa-{n}.png').convert('RGB') for n in names]
          for i in range(len(ims)-1):
              assert ImageChops.difference(ims[i],ims[i+1]).getbbox() is not None, (
                 f'Same rendered screen for {names[i]} and {names[i+1]}')
          for name,im in zip(names,ims):
              assert len(im.getcolors(65536) or [])>64, f'Blank screen: {name}'
          print('PASS: Five independently booted PSP screens are nonblank and distinct')
          PY

      - name: Upload fully compiled game and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Ascent-Gameplay-Overhaul-PSP-Hardware-UNVERIFIED
          path: |
            portable_build/EBOOT.PBP
            portable_build/SHA256.txt
            portable_build/imports.txt
            emulator_results/
          if-no-files-found: warn

      - name: Pin versioned successful PSP EBOOTs
        if: success() && github.ref_name == 'release-1.0.1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin release-1.0.1
          if [ "$(git rev-parse origin/release-1.0.1)" != "$GITHUB_SHA" ]; then
            echo "Branch advanced; newer run will publish."
            exit 0
          fi
          mkdir -p versions/1.0.0 versions/1.0.1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12506795691/zip" > /tmp/rift100.zip
          unzip -p /tmp/rift100.zip portable_build/EBOOT.PBP > versions/1.0.0/EBOOT.PBP
          cp portable_build/EBOOT.PBP versions/1.0.1/EBOOT.PBP
          (cd versions/1.0.0 && sha256sum EBOOT.PBP > SHA256.txt)
          (cd versions/1.0.1 && sha256sum EBOOT.PBP > SHA256.txt)
          test -s versions/1.0.0/EBOOT.PBP
          test -s versions/1.0.1/EBOOT.PBP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/1.0.0/EBOOT.PBP versions/1.0.0/SHA256.txt versions/1.0.1/EBOOT.PBP versions/1.0.1/SHA256.txt
          git commit -m "Archive versioned 1.0.0 and validated 1.0.1 PSP EBOOTs"
          git push origin HEAD:release-1.0.1

      - name: Archive successful EBOOT permanently in GitHub Releases
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_eboot="portable_build/EBOOT.PBP"
          test -s "$source_eboot"
          # Do not imply that the public CI artifact contains the user's private music.
          python3 - <<'PY'
          from pathlib import Path
          eboot=Path('portable_build/EBOOT.PBP').read_bytes()
          assert eboot[:4]==b'\\x00PBP', 'Not a PSP executable'
          assert eboot[-96:-88]!=b'RIFTM103', 'Private audio cannot enter a public release'
          PY
          version="$(sed -n 's/^PSP_EBOOT_TITLE = RIFT ASCENT //p' portable_build/Makefile | head -n1)"
          test -n "$version"
          safe_branch="$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9._-' '-')"
          tag="psp-${safe_branch}-build-${GITHUB_RUN_NUMBER}"
          mkdir -p permanent-release
          filename="Rift-Ascent-v${version}-build-${GITHUB_RUN_NUMBER}-NO-MUSIC-EBOOT.PBP"
          cp "$source_eboot" "permanent-release/$filename"
          (cd permanent-release && sha256sum "$filename" > "${filename}.sha256")
          cat > permanent-release/RELEASE-NOTES.md <<EOF
          # Rift Ascent ${version} — PSP build ${GITHUB_RUN_NUMBER}

          **Experimental PSP/ARK-5 build; real PSP hardware is not verified.**

          - Branch: \`${GITHUB_REF_NAME}\`
          - Commit: \`${GITHUB_SHA}\`
          - Full automated test run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - SHA-256 checksum included as a separate downloadable asset.

          **Audio:** This public GitHub build does **not** contain the ten privately
          provided soundtrack recordings. It also does **not** generate synthetic
          background music. Sound effects work. The complete user-soundtrack
          edition is maintained separately in the owner's ChatGPT Rift Ascent Library.

          To install: rename the downloaded PBP to \`EBOOT.PBP\` and place it at
          \`PSP/GAME/RIFTASCENT/EBOOT.PBP\`.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving original build."
          else
            gh release create "$tag" \
              "permanent-release/$filename" \
              "permanent-release/${filename}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Rift Ascent ${version} — build ${GITHUB_RUN_NUMBER} (NO MUSIC)" \
              --notes-file permanent-release/RELEASE-NOTES.md \
              --prerelease
          fi
          echo "Permanent EBOOT download: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
