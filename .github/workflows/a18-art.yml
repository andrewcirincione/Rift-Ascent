name: A1.8 AI asset generation
on:
  push:
    branches: [A1.8]
    paths: ['.github/workflows/a18-art.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paintings:
    strategy:
      fail-fast: false
      matrix:
        group: [warden, vesper, proxy, world]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU diffusion runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.35.1 transformers==4.49.0 accelerate==1.10.1 safetensors==0.6.2 pillow==11.3.0
      - name: Generate original illustrations
        run: python qa/a18/generate_assets.py '${{ matrix.group }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A18-AI-art-${{ matrix.group }}
          path: art-output/${{ matrix.group }}/
          if-no-files-found: warn
          compression-level: 0
