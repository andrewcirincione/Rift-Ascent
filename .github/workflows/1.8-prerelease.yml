name: Build and publish 1.8 prerelease
on:
  push:
    branches: ['1.8-Pre-release']
    paths: ['.github/workflows/1.8-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rift-1-8-prerelease-only
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/1.8-Pre-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RIFT_ROOT: prerelease/1.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.8-Pre-release
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record protected release state and install verification tools
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = '1.8-Pre-release'
          mkdir -p "$RIFT_ROOT/evidence"
          git ls-remote origin refs/heads/main refs/heads/A1.8 refs/tags/v1.71-r2 > "$RUNNER_TEMP/protected-refs.before"
          python -m pip install pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 websockets==15.0.1 python-xlib==0.33
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth libgl1-mesa-dri libglu1-mesa libasound2t64 libpulse0 pulseaudio pulseaudio-utils
      - name: Restore original AI paintings from their immutable artifacts
        run: |
          set -euo pipefail
          for item in warden:12796919911 vesper:12797667253 proxy:12798155663 world:12797632450 refined:12799225643; do
            name=${item%:*}; id=${item#*:}
            mkdir -p "$RIFT_ROOT/original-art/$name"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RIFT_ROOT/original-art/$name"
          done
          python "$RIFT_ROOT/assemble.py" restore
          python "$RIFT_ROOT/assemble.py" assets | tee "$RIFT_ROOT/evidence/asset-tests.txt"
      - name: Native sanitized progression and persistence regression tests
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I "$RIFT_ROOT/source" "$RIFT_ROOT/tests/progression.c" "$RIFT_ROOT/source/game.c" -o "$RUNNER_TEMP/progression"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/progression" | tee "$RIFT_ROOT/evidence/native-tests.txt"
          gcc -O1 -I "$RIFT_ROOT/source" "$RIFT_ROOT/tests/fixtures.c" "$RIFT_ROOT/source/game.c" -o "$RIFT_ROOT/tests/fixtures"
          gcc -O1 -DLAYOUT_ONLY -I "$RIFT_ROOT/source" "$RIFT_ROOT/tests/fixtures.c" -o "$RUNNER_TEMP/layout"
          "$RUNNER_TEMP/layout" > "$RIFT_ROOT/evidence/state-layout.json"
          gcc -O1 -DATTACK_IDS_ONLY -I "$RIFT_ROOT/source" "$RIFT_ROOT/tests/fixtures.c" "$RIFT_ROOT/source/game.c" -o "$RUNNER_TEMP/attacks"
          "$RUNNER_TEMP/attacks" > "$RIFT_ROOT/evidence/attack-ids.json"
      - name: Fresh pinned PSPDEV compilation and complete media packaging
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/$RIFT_ROOT/source:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; psp-nm -S rift_ascent_crt_free.elf > symbols.txt' 2>&1 | tee "$RIFT_ROOT/evidence/pspdev-build.log"
          sudo chown -R "$(id -u):$(id -g)" "$RIFT_ROOT/source"
          cp "$RIFT_ROOT/source/symbols.txt" "$RIFT_ROOT/evidence/symbols.txt"
          python "$RIFT_ROOT/assemble.py" package | tee "$RIFT_ROOT/evidence/package-tests.txt"
          cp "$RIFT_ROOT/source/rift_ascent_crt_free.elf" "$RIFT_ROOT/release/"
      - name: Preserve complete source and compiled candidate before emulator testing
        uses: actions/upload-artifact@v4
        with:
          name: 1.8-prerelease-recovered-compiled-candidate
          path: |
            prerelease/1.8/source/
            prerelease/1.8/release/
            prerelease/1.8/art/assets.json
            prerelease/1.8/evidence/
          compression-level: 1
      - name: Prepare pinned PPSSPP runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ppsspp"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12795586984/zip" > "$RUNNER_TEMP/ppsspp.zip"
          unzip -q "$RUNNER_TEMP/ppsspp.zip" -d "$RUNNER_TEMP/ppsspp"
          image=$(find "$RUNNER_TEMP/ppsspp" -name PPSSPP.AppImage -print -quit)
          test -n "$image"; chmod +x "$image"
          cd "$RUNNER_TEMP/ppsspp"
          "$image" --appimage-extract >/dev/null
          app=$(find "$RUNNER_TEMP/ppsspp" -path '*/AppDir/AppRun' -print -quit)
          test -n "$app"
          # Null output retains the game/audio worker while automation runs.
          if [ -f "$(dirname "$app")/.env" ]; then sed -i 's/SDL_AUDIODRIVER=pulseaudio/SDL_AUDIODRIVER=dummy/' "$(dirname "$app")/.env"; fi
          echo "PPSSPP_APP=$app" >> "$GITHUB_ENV"
      - name: Exact packaged EBOOT assisted progression smoke tests
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 960x544x24' python "$RIFT_ROOT/tests/smoke.py" "$RIFT_ROOT" "$PPSSPP_APP" 2>&1 | tee "$RIFT_ROOT/evidence/ppsspp-smoke.txt"
          python "$RIFT_ROOT/finalize.py" | tee "$RIFT_ROOT/evidence/dist-tests.txt"
      - name: Commit readable source, original paintings and verified EBOOT to this branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = '1.8-Pre-release'
          rm -f "$RIFT_ROOT/source/"*.o "$RIFT_ROOT/source/"*.elf "$RIFT_ROOT/source/EBOOT.PBP" "$RIFT_ROOT/source/PARAM.SFO" "$RIFT_ROOT/source/game.map" "$RIFT_ROOT/source/symbols.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$RIFT_ROOT/source" "$RIFT_ROOT/original-art" "$RIFT_ROOT/art" "$RIFT_ROOT/evidence" "$RIFT_ROOT/release" "$RIFT_ROOT/recovery/source-hashes.json"
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changed and all(p.startswith('prerelease/1.8/') for p in changed), changed
          PY
          git commit -m 'Publish verified 1.8 prerelease source, paintings, EBOOT and test evidence'
          git push origin HEAD:refs/heads/1.8-Pre-release
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create new prerelease, upload verified assets and check remote digests
        run: |
          set -euo pipefail
          tag=v1.8-pre.1
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python - "$RUNNER_TEMP/existing.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['isDraft'], 'Do not overwrite an already published release'
          PY
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" --title 'Rift Ascent 1.8 Pre-release' --notes-file "$RIFT_ROOT/RELEASE_NOTES.md" --draft --prerelease --latest=false
          fi
          gh release upload "$tag" "$RIFT_ROOT/dist/"* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/remote-release.json"
          python - "$RUNNER_TEMP/remote-release.json" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          r=json.load(open(sys.argv[1]));assert r['draft'] and r['prerelease']
          remote={a['name']:a for a in r['assets']}
          for p in Path('prerelease/1.8/dist').iterdir():
            if p.is_file():
              a=remote[p.name];assert a['size']==p.stat().st_size,p.name
              assert a.get('digest')=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print('PASS every uploaded release asset matches its tested local bytes')
          PY
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,targetCommitish > "$RIFT_ROOT/evidence/PUBLISHED.json"
          cat "$RIFT_ROOT/evidence/PUBLISHED.json" >> "$GITHUB_STEP_SUMMARY"
          git ls-remote origin refs/heads/main refs/heads/A1.8 refs/tags/v1.71-r2 > "$RUNNER_TEMP/protected-refs.after"
          cmp "$RUNNER_TEMP/protected-refs.before" "$RUNNER_TEMP/protected-refs.after"
      - name: Retain publication outputs and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1.8-prerelease-release-and-evidence
          path: |
            prerelease/1.8/dist/
            prerelease/1.8/release/
            prerelease/1.8/evidence/
          if-no-files-found: warn
          compression-level: 1
