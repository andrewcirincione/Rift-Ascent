name: Publish PSP release
on:
  push:
    branches: [main]
    paths: ['release/current.json', '.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-psp-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            release
            tools
      - name: Fetch only this release's declared sources and media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import json,subprocess
          meta=json.load(open('release/current.json'))
          paths=set(meta.get('source_paths',[]))
          paths.update(['GAME','portable_build',meta['canonical_source']])
          for key in ['eboot','notes','screenshot','validation','resources_manifest']:
              if meta.get(key):paths.add(meta[key])
          dirs=set()
          for path in sorted(paths):
              p=PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts,path
              entry=subprocess.check_output(['git','ls-tree','HEAD','--',path],text=True).split()
              assert entry and entry[1] in ('tree','blob'),path
              directory=path if entry[1]=='tree' else str(p.parent)
              if directory!='.':dirs.add(directory)
          subprocess.run(['git','sparse-checkout','add',*sorted(dirs)],check=True)
          PY
          git ls-remote origin 'refs/tags/*' > "$RUNNER_TEMP/tags.before"
      - name: Validate and package the exact tested EBOOT
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_github_release.py
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          meta=json.load(open('release/current.json'))
          shutil.copyfile(meta['eboot'],'dist/EBOOT.PBP')
          files=[p for p in Path('dist').iterdir() if p.is_file() and p.name!='SHA256SUMS.txt']
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(files)))
          PY
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag=$(python3 -c 'import json; print(json.load(open("release/current.json"))["tag"])')
          release_version=$(python3 -c 'import json; print(json.load(open("release/current.json"))["version"])')
          release_notes=$(python3 -c 'import json; print(json.load(open("release/current.json"))["notes"])')
          if gh release view "$release_tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            python3 - "$RUNNER_TEMP/existing-release.json" <<'PY'
          import json,sys
          release=json.load(open(sys.argv[1]))
          assert release['isDraft'],'Already published: use a new tag for a changed release'
          PY
            gh release edit "$release_tag" --target "$GITHUB_SHA" --notes-file "$release_notes"
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --title "Rift Ascent $release_version" --notes-file "$release_notes" --draft
          fi
          gh release upload "$release_tag" dist/* --clobber
          release_id=$(gh release view "$release_tag" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/uploaded-release.json"
          python3 tools/check_release_upload.py "$RUNNER_TEMP/uploaded-release.json"
          gh release edit "$release_tag" --draft=false --latest
          gh release view "$release_tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
          git ls-remote origin 'refs/tags/*' > "$RUNNER_TEMP/tags.after"
          python3 - "$RUNNER_TEMP/tags.before" "$RUNNER_TEMP/tags.after" <<'PY'
          import sys
          def refs(p):return {line.split()[1]:line.split()[0] for line in open(p) if line.strip()}
          before,after=map(refs,sys.argv[1:])
          assert all(after.get(k)==v for k,v in before.items()),'An existing published tag changed'
          print('PASS all pre-existing tags preserved; only the new current release was published')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-assets
          path: dist/
          if-no-files-found: warn
          compression-level: 0
