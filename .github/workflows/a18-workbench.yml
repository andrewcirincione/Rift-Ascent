name: A1.8 development workbench
on:
  push:
    branches: [A1.8]
    paths: ['.github/workflows/a18-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export canonical 1.71-r2 sources and original complete package
        run: |
          set -euo pipefail
          mkdir -p workbench
          python3 - <<'PY'
          import json, pathlib, zipfile
          root=pathlib.Path('.')
          paths=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          with zipfile.ZipFile('workbench/A18-base.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in paths:
              s=p.as_posix()
              if s.startswith(('qa/v171r2/','tools/','portable/','GAME/src/','versions/1.71-r2/','release/')) or s=='AGENTS.md':
                z.write(p,s)
              elif s.startswith('qa/') and p.suffix in ('.py','.c','.md','.json','.sh') and p.stat().st_size<200000:
                z.write(p,s)
            z.writestr('repo_paths.json',json.dumps([{'path':str(p),'size':p.stat().st_size} for p in paths],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: A18-canonical-base
          path: workbench/A18-base.zip
          compression-level: 0
      - name: Export pinned PSPDEV filesystem
        run: |
          set -euo pipefail
          docker pull pspdev/pspdev:v20261001
          cid=$(docker create pspdev/pspdev:v20261001)
          docker export "$cid" | gzip -1 > workbench/pspdev-rootfs.tar.gz
          docker rm "$cid"
      - uses: actions/upload-artifact@v4
        with:
          name: A18-PSPDEV-toolchain
          path: workbench/pspdev-rootfs.tar.gz
          compression-level: 0
      - name: Export emulator and dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 -o workbench/PPSSPP.AppImage https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          mkdir -p workbench/debs
          cd workbench/debs
          sudo apt-get update -qq
          apt-get download libglu1-mesa libpulse0 libpulse-mainloop-glib0 pulseaudio pulseaudio-utils libasyncns0 libsndfile1 libwrap0 libwebrtc-audio-processing1 libspeexdsp1 libtdb1 liborc-0.4-0 libltdl7 libflac12t64 libopus0 libvorbis0a libvorbisenc2 libogg0 libxdo3 xdotool || true
      - uses: actions/upload-artifact@v4
        with:
          name: A18-PPSSPP-runtime
          path: |
            workbench/PPSSPP.AppImage
            workbench/debs/
          compression-level: 0
