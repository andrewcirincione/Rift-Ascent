name: Rift Ascent 1.1.4 Exact EBOOT Playtest

on:
  push:
    branches:
      - v1.1.4-art-refresh-qa
    paths:
      - '.github/workflows/playtest-v114.yml'
      - 'qa/v114/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playtest-exact-patched-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and cryptographically verify the exact 1.1.4 EBOOT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          mkdir -p qa_runtime qa_evidence
          cat qa/v114/parts/part_*.txt | base64 -d | xz -d > qa_runtime/EBOOT.PBP
          # Correct 1.1.3 base-build layout mismatch discovered on the first
          # real emulator screenshot. Patch exactly the affected texture regions.
          cat qa/v114/fixes/fixpart_*.txt | base64 -d | xz -d > qa_runtime/texture_fix.bin
          python3 - <<'PYFIX'
          from pathlib import Path
          import struct
          patch=Path('qa_runtime/texture_fix.bin').read_bytes()
          assert patch[:8]==b'RIFT114P'
          count=struct.unpack_from('<I',patch,8)[0]
          source=bytearray(Path('qa_runtime/EBOOT.PBP').read_bytes())
          p=12
          for _ in range(count):
              off,n=struct.unpack_from('<II',patch,p);p+=8
              source[off:off+n]=patch[p:p+n];p+=n
          assert p==len(patch)
          Path('qa_runtime/EBOOT.PBP').write_bytes(source)
          PYFIX
          # Replace the artwork once more after playtest review: the original
          # illustrated logo was partially covered by menu buttons. New logo
          # is above the menu and cannot overlap its interactive labels.
          cat qa/v114/titlefix/titlefix_*.txt | base64 -d | xz -d > qa_runtime/title_fix.bin
          python3 - <<'PYTITLE'
          from pathlib import Path
          import struct
          patch=Path('qa_runtime/title_fix.bin').read_bytes()
          assert patch[:8]==b'RIFT114T'
          off,n=struct.unpack_from('<II',patch,8)
          assert n==480*272*2
          assert len(patch)==16+n
          data=bytearray(Path('qa_runtime/EBOOT.PBP').read_bytes())
          data[off:off+n]=patch[16:]
          Path('qa_runtime/EBOOT.PBP').write_bytes(data)
          PYTITLE
          # The earlier executable still carried the 1.1.3 launcher title,
          # despite being an art-refresh v1.1.4. Correct only PARAM.SFO.
          python3 - <<'PYSFO'
          from pathlib import Path
          import struct
          path=Path('qa_runtime/EBOOT.PBP')
          b=bytearray(path.read_bytes())
          o=struct.unpack_from('<8I',b,8)
          old=b'RIFT ASCENT 1.1.3'
          i=b.find(old,o[0],o[1])
          assert i>=0 and b.count(old)==1
          b[i:i+len(old)]=b'RIFT ASCENT 1.1.4'
          path.write_bytes(b)
          PYSFO
          echo '25c66e3111ee964fb8f2c6b4702704b9b518061e16266050f9d4cd2e000d01fd  qa_runtime/EBOOT.PBP' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io, hashlib, struct, collections
          p=Path('qa_runtime/EBOOT.PBP').read_bytes()
          assert p[:4] == b'\0PBP'
          offsets=struct.unpack_from('<8I',p,8)
          assert offsets == tuple(sorted(offsets)) and len(p)>offsets[6]+3000000
          pic=p[offsets[4]:offsets[5]]
          assert hashlib.sha256(pic).hexdigest() == '81e5de47631cc5c0bfa5da922b5f6d29119d2a1fc20cbfda68bfb9dcf5b8d889'
          with Image.open(io.BytesIO(pic)) as im:
              assert im.size==(480,272),im.size
              assert len(im.getcolors(1_000_000))>10000,'XMB splash incorrectly quantized'
              im.save('qa_evidence/xmb-PIC1-extracted.png')
          elf=p[offsets[6]:]
          assert elf[:4] == b'\x7fELF'
          W,H=480,272
          title=elf[0x1b6890:0x1b6890+W*H*2]
          assert len(title)==W*H*2
          hero=elf[2085520:2085520+210*127*2]
          assert len(hero)==210*127*2
          assert hero.count(b'\x1f\xf8')>200,'Missing transparent pixels in hero sprite'
          assert hero.count(b'\x1f\xf8')<len(hero)//2,'Hero has too much transparency'
          assert p[-96:-88]!=b'RIFTM103','Private soundtrack must not be published on public GitHub'
          print('PASS: exact EBOOT checksum, ELF, PIC1 native dimensions, embedded title texture and hero')
          PY

      - name: Install PPSSPP and screen interaction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb imagemagick python3-pil xdotool libgl1-mesa-dri libglu1-mesa libasound2t64 libpulse0 pulseaudio pulseaudio-utils curl
          curl --fail --location --retry 3 --output PPSSPP.AppImage https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          chmod +x PPSSPP.AppImage
          ./PPSSPP.AppImage --appimage-extract >/dev/null

      - name: Boot exact EBOOT, play controls and inspect rendered screens
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/rift114-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=rift114_null || true
          mkdir -p "$HOME/.config/ppsspp/PSP/SYSTEM" "$HOME/.config/ppsspp/PSP/GAME/RIFTASCENT" "$HOME/.config/ppsspp/GAME/RIFTASCENT"
          cat > "$HOME/.config/ppsspp/PSP/SYSTEM/controls.ini" <<'CONTROLS'
          [ControlMapping]
          Cross = 1-54
          Circle = 1-52
          Square = 1-29
          Triangle = 1-47
          Up = 1-19
          Down = 1-20
          Left = 1-21
          Right = 1-22
          Start = 1-62
          Select = 1-66
          CONTROLS
          cp qa_runtime/EBOOT.PBP "$HOME/.config/ppsspp/PSP/GAME/RIFTASCENT/EBOOT.PBP"
          cp qa_runtime/EBOOT.PBP "$HOME/.config/ppsspp/GAME/RIFTASCENT/EBOOT.PBP"
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            ./squashfs-root/AppRun "$PWD/qa_runtime/EBOOT.PBP" > qa_evidence/ppsspp.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 14
            kill -0 "$pid" || { echo "PPSSPP terminated unexpectedly"; exit 1; }
            import -display "$DISPLAY" -window root qa_evidence/title.png
            # PPSSPP software rendering is slow under Xvfb. A 10ms key tap
            # can be missed by the PSP controller poll. Focus the SDL window and
            # hold each physical key for several emulated frames.
            win="$(xdotool search --onlyvisible --name PPSSPP | head -n 1 || true)"
            echo "PPSSPP window=$win" | tee -a qa_evidence/controls.log
            if [ -n "$win" ]; then xdotool windowfocus "$win" || true; fi
            xdotool getwindowfocus getwindowname | tee -a qa_evidence/controls.log || true
            xdotool keydown z; sleep 2; xdotool keyup z
            sleep 5
            import -display "$DISPLAY" -window root qa_evidence/after-cross.png
            xdotool keydown z; sleep 2; xdotool keyup z
            sleep 5
            import -display "$DISPLAY" -window root qa_evidence/after-second-cross.png
            xdotool keydown Right; sleep 2; xdotool keyup Right
            xdotool keydown z; sleep 2; xdotool keyup z
            sleep 5
            import -display "$DISPLAY" -window root qa_evidence/after-route.png
            xdotool keydown space; sleep 2; xdotool keyup space
            sleep 5
            import -display "$DISPLAY" -window root qa_evidence/after-start.png
            sleep 5
            kill -0 "$pid" || { echo "PPSSPP died in interaction playtest"; exit 1; }
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          python3 - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          names=['title','after-cross','after-second-cross','after-route','after-start']
          ims=[Image.open(Path('qa_evidence')/f'{n}.png').convert('RGB') for n in names]
          for n,im in zip(names,ims):
              assert im.size==(1280,720),(n,im.size)
              assert len(im.crop((160,88,1120,632)).getcolors(1_000_000))>700,f'Blank or low detail {n}'
          # Count changed pixels. An unchanged menu for all interactions is a failed playtest.
          diffs=[]
          for a,b in zip(ims,ims[1:]):
              diff=ImageChops.difference(a.crop((160,88,1120,632)),b.crop((160,88,1120,632))).convert('L')
              diffs.append(sum(1 for v in diff.getdata() if v>30))
          print('Frame-to-frame significantly changed pixels:',diffs)
          assert max(diffs)>20000,'X button never advanced game state, or emulator did not react'
          assert min(diffs)>=0
          print('PASS: title art renders, user input advances game state, process survives playtest')
          PY
          tail -80 qa_evidence/ppsspp.log || true

      - name: Upload exact EBOOT and playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Ascent-1.1.4-EXACT-EBOOT-Playtest-Evidence
          path: |
            qa_runtime/EBOOT.PBP
            qa_evidence/
          if-no-files-found: warn

      - name: Publish tested NO-MUSIC binary as GitHub prerelease
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.1.4-art-refresh-qa'
          fname='Rift-Ascent-v1.1.4-NO-MUSIC-EBOOT.PBP'
          cp qa_runtime/EBOOT.PBP "qa_runtime/$fname"
          (cd qa_runtime && sha256sum "$fname" > "$fname.sha256")
          cat > qa_runtime/RELEASE_NOTES.md <<'EOF'
          Rift Ascent v1.1.4 visual-art refresh (EXPERIMENTAL, PSP hardware unverified).
          Verified in GitHub Actions with PPSSPP using the exact EBOOT binary.
          New 480x272 XMB splash, illustrated title screen, and painted hero sprite.
          Public release has NO MUSIC: user's private ten original soundtrack tracks
          are available only in the separate complete ChatGPT Library build.
          Download PBP and rename to EBOOT.PBP for PSP/GAME/RIFTASCENT/.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "qa_runtime/$fname" "qa_runtime/$fname.sha256" --clobber
          else
            gh release create "$tag" "qa_runtime/$fname" "qa_runtime/$fname.sha256" \
              --title 'Rift Ascent 1.1.4 — Art Refresh (NO MUSIC, experimental)' \
              --target "$GITHUB_SHA" --notes-file qa_runtime/RELEASE_NOTES.md --prerelease
          fi