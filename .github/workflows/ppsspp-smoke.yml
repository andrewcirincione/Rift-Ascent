name: PPSSPP title-screen boot smoke test

on:
  push:
    paths:
      - '.github/workflows/ppsspp-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Extract Rift Ascent source
        run: |
          set -euo pipefail
          unzip -q -o Rift_Ascent_GitHub_OneClick_Setup.zip
          test -f GAME/Makefile

      - name: Insert PSP hardware startup diagnostics
        run: |
          set -euo pipefail
          python3 patches/diagnose_psp_boot.py GAME/src/psp_main.c

      - name: Build actual EBOOT with PSPSDK
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/GAME:/src" -w /src pspdev/pspdev:v20261001 sh -c 'set -eu; make clean; make -j2; test -s EBOOT.PBP'
          python3 GAME/verify_eboot.py GAME/EBOOT.PBP

      - name: Prepare software-rendered X display
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb imagemagick mesa-utils libgl1-mesa-dri libglu1-mesa libasound2t64 libpulse0 pulseaudio pulseaudio-utils wget

      - name: Download official stable PPSSPP Linux AppImage
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output PPSSPP.AppImage \
            https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          chmod +x PPSSPP.AppImage
          ./PPSSPP.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch PPSSPP with PulseAudio and capture the real screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p EMULATOR_OUTPUT
          export LIBGL_ALWAYS_SOFTWARE=1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulseaudio
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d /tmp/ppsspp-xdg-XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl info
          pactl load-module module-null-sink sink_name=ppsspp_null || true
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -u
            ./squashfs-root/AppRun "$PWD/GAME/EBOOT.PBP" > EMULATOR_OUTPUT/ppsspp.log 2>&1 &
            pid=$!
            echo "Emulator PID: $pid"
            sleep 25
            import -display "$DISPLAY" -window root EMULATOR_OUTPUT/screenshot.png || true
            if kill -0 "$pid" 2>/dev/null; then
              echo "PPSSPP remained running at 25 seconds" | tee EMULATOR_OUTPUT/process-status.txt
              kill "$pid" 2>/dev/null || true
            else
              echo "PPSSPP exited before 25 seconds" | tee EMULATOR_OUTPUT/process-status.txt
            fi
            wait "$pid" 2>/dev/null || true
          '
          test -s EMULATOR_OUTPUT/screenshot.png
          file EMULATOR_OUTPUT/screenshot.png
          tail -120 EMULATOR_OUTPUT/ppsspp.log || true
          grep -q "remained running" EMULATOR_OUTPUT/process-status.txt || {
            echo "FAIL: emulator exited before the screenshot" >&2
            exit 1
          }
          colors="$(identify -format '%k' EMULATOR_OUTPUT/screenshot.png)"
          echo "Screen unique colors: $colors"
          if [ "$colors" -lt 16 ]; then
            echo "FAIL: Screenshot appears blank; emulator launch not verified" >&2
            exit 1
          fi

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Ascent-Emulator-Smoke
          path: |
            EMULATOR_OUTPUT/
          if-no-files-found: warn
