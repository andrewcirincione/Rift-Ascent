name: A1.8 arena art refinement
on:
  push:
    branches: [A1.8]
    paths: ['.github/workflows/a18-refine-art.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paintings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.35.1 transformers==4.49.0 accelerate==1.10.1 safetensors==0.6.2 pillow==11.3.0
      - run: python qa/a18/refine_arena.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A18-refined-arena
          path: refined-art/
          if-no-files-found: warn
          compression-level: 0
